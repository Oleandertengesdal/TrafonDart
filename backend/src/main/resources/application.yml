# TrafonDart backend configuration.
# Every secret is read from an environment variable. Nothing secret is committed – see backend/.env.example.

spring:
  application:
    name: trafondart
  datasource:
    # JDBC URL, e.g. jdbc:postgresql://ep-xyz.eu-central-1.aws.neon.tech/trafondart?sslmode=require
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trafondart}
    username: ${DATABASE_USERNAME:trafondart}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      tracking-modes: cookie

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  jwt:
    # REQUIRED in production: at least 32 random bytes, e.g. `openssl rand -base64 48`
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:14d}
  cookie:
    secure: ${COOKIE_SECURE:true}
  websocket:
    # Comma-separated list of frontend origins allowed to open the live-score socket
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # Reverse proxies we control in front of the app. Vercel rewrite → Render = 2. Local = 0.
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:0}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    real-name: ${BOOTSTRAP_ADMIN_REAL_NAME:Administrator}

logging:
  level:
    root: INFO
    no.trafondart: INFO
