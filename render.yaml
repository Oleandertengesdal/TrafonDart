# Render Blueprint for the TrafonDart backend.
# Render dashboard → New → Blueprint → pick this repo. See docs/DEPLOYMENT.md for the full walkthrough.
# Values marked `sync: false` are secrets: Render asks for them on first deploy and they never live in Git.
services:
  - type: web
    name: trafondart-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true          # random 256-bit value generated by Render
      - key: DATABASE_URL
        sync: false                  # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: WS_ALLOWED_ORIGINS
        sync: false                  # https://<your-app>.vercel.app
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_REAL_NAME
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "2"                   # browser → Vercel rewrite → Render → app
      - key: DB_POOL_SIZE
        value: "5"
      # Optional, add under Environment in the dashboard (see docs/OPERATIONS.md and docs/AWARDS.md):
      #   SENTRY_DSN               error alerts to Sentry (off when unset)
      #   SENTRY_ENVIRONMENT       default "production"
      #   AWARDS_ZONE, AWARDS_MIN_MATCHES, AWARDS_MIN_MATCHES_YEAR
